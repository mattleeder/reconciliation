trigger:
  branches:
    include:
      - master
  paths:
    include:
      - src/
      - tests/
      - global.json
      - dotnet-tools.json
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: sql
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $(SqlPassword)
      ports: 
        - "1433:1433"
        

jobs:
  - job: BuildAndTest
    services:
      sql: sql
    steps:
      - task: UseDotNet@2
        inputs:
          useGlobalJson: true
      - script: dotnet build tests/Reconciliation.Tests
        displayName: Build tests
      - script: dotnet build src/Reconciliation.Worker
        displayName: Build worker
      - script: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/1433) 2>/dev/null; then
              echo "SQL is accepting connections (attempt $i)"
              exit 0
            fi
            echo "Waiting for SQL ($i/30)..."
            sleep 2
          done
          echo "SQL did not start in time"
          exit 1
        displayName: Wait for SQL
        displayName: Wait for SQL
      - script: dotnet test tests/Reconciliation.Tests --no-build
        displayName: Run tests
        env:
          RECONCILIATION_CONNECTION: Server=localhost,1433;Database=Reconciliation;User ID=sa;Password=$(SqlPassword);TrustServerCertificate=True