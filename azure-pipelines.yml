trigger:
  branches:
    include:
      - master
  paths:
    include:
      - src/
      - tests/
      - global.json
      - dotnet-tools.json
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: sql
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $(SqlPassword)
      ports: 
        - "1433:1433"

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        services:
          sql: sql
        steps:
          - task: UseDotNet@2
            inputs:
              useGlobalJson: true
          - script: dotnet build tests/Reconciliation.Tests
            displayName: Build tests
          - script: dotnet build src/Reconciliation.Worker
            displayName: Build worker
          - script: |
              for i in $(seq 1 30); do
                if (echo > /dev/tcp/localhost/1433) 2>/dev/null; then
                  echo "SQL is accepting connections (attempt $i)"
                  exit 0
                fi
                echo "Waiting for SQL ($i/30)..."
                sleep 2
              done
              echo "SQL did not start in time"
              exit 1
            displayName: Wait for SQL
          - script: dotnet test tests/Reconciliation.Tests --no-build
            displayName: Run tests
            env:
              RECONCILIATION_CONNECTION: Server=localhost,1433;Database=Reconciliation;User ID=sa;Password=$(SqlPassword);TrustServerCertificate=True
          - script: dotnet publish src/Reconciliation.Web -c Release -o $(Build.ArtifactStagingDirectory)/web
            displayName: Publish Reconciliation.Web
          - script: dotnet publish src/Reconciliation.Worker -c Release -o $(Build.ArtifactStagingDirectory)/worker
            displayName: Publish Reconciliation.Worker
          - task: ArchiveFiles@2
            displayName: Zip Web
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/web
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/drop/web.zip
          - task: ArchiveFiles@2
            displayName: Zip Worker
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/worker
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/drop/worker.zip
          - script: dotnet tool restore
            displayName: Restore dotnet tools
          - script: dotnet ef migrations script --idempotent --project src/Reconciliation.Data --output $(Build.ArtifactStagingDirectory)/drop/migrate.sql
            env:
              RECONCILIATION_CONNECTION: Server=unused;Database=unused
            displayName: Generate migration script
          - publish: $(Build.ArtifactStagingDirectory)/drop
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: Migrate
        displayName: Apply migrations
        steps:
          - download: current
            artifact: drop
          - task: AzureCLI@2
            displayName: Apply migration script
            inputs:
              azureSubscription: azure-reconciliation
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                server=sql-recon-mattl-swedencentral
                rule=ci-$(Build.BuildId)
                ip=$(curl -fsS https://api.ipify.org)
                az sql server firewall-rule create --resource-group rg-reconciliation --server "$server" --name "$rule" --start-ip-address "$ip" --end-ip-address "$ip" --output none
                trap 'az sql server firewall-rule delete --resource-group rg-reconciliation --server "$server" --name "$rule" --yes' EXIT
                curl -fsSL -o sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
                tar -xjf sqlcmd.tar.bz2 sqlcmd
                for attempt in 1 2 3 4 5; do
                  if ./sqlcmd -S "$server.database.windows.net" -d Reconciliation --authentication-method ActiveDirectoryDefault -i "$(Pipeline.Workspace)/drop/migrate.sql" -b; then
                    echo "Migrations applied"
                    exit 0
                  fi
                  echo "Attempt $attempt failed, retrying in 30s"
                  sleep 30
                done
                echo "Migration failed"
                exit 1

      - job: DeployWebApp
        displayName: Deploy Web App
        dependsOn: Migrate
        steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: Deploy web app
            inputs:
              azureSubscription: azure-reconciliation
              appType: webAppLinux
              appName: app-recon-mattl
              package: $(Pipeline.Workspace)/drop/web.zip

      - job: DeployFunctionApp
        displayName: Deploy Function App
        steps:
          - download: current
            artifact: drop
          - task: AzureFunctionApp@2
            displayName: Deploy worker
            inputs:
              azureSubscription: azure-reconciliation
              appType: functionAppLinux
              isFlexConsumption: true
              appName: func-recon-mattl
              package: $(Pipeline.Workspace)/drop/worker.zip