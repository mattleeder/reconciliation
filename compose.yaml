services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reconciliation-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - reconciliation-sql-data:/var/opt/mssql
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: reconciliation-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    command: "azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"

volumes:
  reconciliation-sql-data:
  azurite-data: